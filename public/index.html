<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TSP Inbox</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --urgent: #ef4444;
      --high: #f97316;
      --medium: #3b82f6;
      --low: #94a3b8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #3b82f6;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: #1e293b;
      color: white;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
    header span { color: #94a3b8; font-size: 13px; }
    header a { color: #60a5fa; text-decoration: none; font-size: 13px; }
    header a:hover { text-decoration: underline; }

    .container { max-width: 680px; margin: 0 auto; padding: 24px 16px; }

    .capture-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    .capture-card h2 { font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .05em; }

    .capture-main {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .capture-main input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color .15s;
    }
    .capture-main input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    .capture-main input::placeholder { color: #94a3b8; }

    .capture-opts {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .capture-opts select, .capture-opts input[type="date"] {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      background: var(--bg);
      outline: none;
    }
    .capture-opts select:focus, .capture-opts input[type="date"]:focus { border-color: var(--accent); }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-header h2 { font-size: 15px; font-weight: 600; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #ef4444;
      color: white;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 12px;
      font-weight: 600;
      min-width: 20px;
    }

    .task-list { display: flex; flex-direction: column; gap: 8px; }

    .task-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--low);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .task-row[data-priority="urgent"] { border-left-color: var(--urgent); }
    .task-row[data-priority="high"]   { border-left-color: var(--high); }
    .task-row[data-priority="medium"] { border-left-color: var(--medium); }

    .task-row-body { flex: 1; min-width: 0; }
    .task-row-title { font-size: 14px; font-weight: 500; margin-bottom: 4px; }
    .task-row-meta { font-size: 12px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }

    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 100px;
      font-size: 11px;
      font-weight: 500;
      background: #f1f5f9;
      color: var(--muted);
    }
    .pill.urgent { background: #fef2f2; color: var(--urgent); }
    .pill.high   { background: #fff7ed; color: var(--high); }
    .pill.medium { background: #eff6ff; color: var(--accent); }

    .assign-form {
      display: none;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .assign-form.open { display: flex; }
    .assign-form select {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      background: var(--bg);
      outline: none;
    }
    .assign-form input[type="text"] {
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      width: 140px;
      outline: none;
    }
    .assign-form input:focus, .assign-form select:focus { border-color: var(--accent); }

    .task-row-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--muted);
      font-size: 14px;
    }
    .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #1e293b;
      color: white;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      opacity: 0;
      transition: opacity .2s;
      pointer-events: none;
      z-index: 9999;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <h1>TSP <span style="font-weight:400;color:#94a3b8;">/ Inbox</span></h1>
    <div style="display:flex;align-items:center;gap:16px;">
      <span>Quick capture & triage</span>
      <a href="/app.html">Full app →</a>
    </div>
  </header>

  <div class="container">
    <div class="capture-card">
      <h2>Quick Add</h2>
      <form id="capture-form">
        <div class="capture-main">
          <input type="text" id="new-title" placeholder="What needs to be done?" autocomplete="off" required>
          <button type="submit" class="btn btn-primary">Add</button>
        </div>
        <div class="capture-opts">
          <select id="new-priority">
            <option value="medium">Medium priority</option>
            <option value="urgent">🔴 Urgent</option>
            <option value="high">🟠 High</option>
            <option value="low">⚪ Low</option>
          </select>
          <input type="date" id="new-due" title="Due date">
        </div>
      </form>
    </div>

    <div class="section-header">
      <h2>Inbox <span id="inbox-count" class="badge" style="margin-left:8px;">0</span></h2>
      <a href="/app.html" style="font-size:13px;color:var(--accent);text-decoration:none;">View all tasks →</a>
    </div>

    <div class="task-list" id="inbox-list">
      <div class="empty-state">
        <div class="icon">📥</div>
        Loading inbox…
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CATEGORIES = ['admin','ops','accounting','marketing','sales','pm','hr','personal'];

    const $ = id => document.getElementById(id);

    async function api(method, path, body) {
      const r = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : {},
        body: body ? JSON.stringify(body) : undefined
      });
      if (r.status === 204) return null;
      return r.json();
    }

    function showToast(msg) {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    function fmtDate(d) {
      if (!d) return '';
      const dt = new Date(d + 'T00:00:00');
      return dt.toLocaleDateString('en-US', { month:'short', day:'numeric' });
    }

    function renderInbox(tasks) {
      const list = $('inbox-list');
      $('inbox-count').textContent = tasks.length;

      if (!tasks.length) {
        list.innerHTML = `<div class="empty-state"><div class="icon">✅</div>Inbox is clear</div>`;
        return;
      }

      list.innerHTML = tasks.map(t => `
        <div class="task-row" data-id="${t.id}" data-priority="${t.priority}">
          <div class="task-row-body">
            <div class="task-row-title">${esc(t.title)}</div>
            <div class="task-row-meta">
              <span class="pill ${t.priority}">${t.priority}</span>
              ${t.due_date ? `<span>Due ${fmtDate(t.due_date)}</span>` : ''}
            </div>
            <div class="assign-form" id="assign-${t.id}">
              <select id="cat-${t.id}">
                <option value="">Category…</option>
                ${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('')}
              </select>
              <input type="text" id="proj-${t.id}" placeholder="Project (optional)">
              <button type="button" class="btn btn-primary btn-sm" onclick="assignTask(${t.id})">Save</button>
              <button type="button" class="btn btn-ghost btn-sm" onclick="toggleAssign(${t.id})">Cancel</button>
            </div>
          </div>
          <div class="task-row-actions">
            <button class="btn btn-ghost btn-sm" onclick="toggleAssign(${t.id})">Assign</button>
            <button class="btn btn-ghost btn-sm" onclick="deleteTask(${t.id})">✕</button>
          </div>
        </div>
      `).join('');
    }

    function toggleAssign(id) {
      const el = document.getElementById(`assign-${id}`);
      el.classList.toggle('open');
    }

    async function assignTask(id) {
      const category = document.getElementById(`cat-${id}`).value;
      const project = document.getElementById(`proj-${id}`).value.trim();
      if (!category && !project) { showToast('Set a category or project to assign'); return; }
      await api('PUT', `/api/tasks/${id}`, { category: category || null, project: project || null });
      showToast('Task assigned');
      loadInbox();
    }

    async function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      await api('DELETE', `/api/tasks/${id}`);
      loadInbox();
    }

    async function loadInbox() {
      const tasks = await api('GET', '/api/tasks?inbox=true');
      renderInbox(tasks);
    }

    $('capture-form').addEventListener('submit', async e => {
      e.preventDefault();
      const title = $('new-title').value.trim();
      if (!title) return;
      await api('POST', '/api/tasks', {
        title,
        priority: $('new-priority').value,
        due_date: $('new-due').value || null
      });
      $('new-title').value = '';
      $('new-due').value = '';
      $('new-priority').value = 'medium';
      $('new-title').focus();
      showToast('Added to inbox');
      loadInbox();
    });

    function esc(s) {
      return String(s)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;');
    }

    loadInbox();
  </script>
</body>
</html>
